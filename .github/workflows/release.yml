name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # required by the provenance attestation
      attestations: write # required by the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$TAG" = "v$version"

      - name: Download the executable and the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Compute the SHA256 checksums
        working-directory: dist
        run: sha256sum -- * > ../SHA256SUMS.txt

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo '## SHA256'
            echo
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/* SHA256SUMS.txt \
            --title "$TAG" --notes-file notes.md --generate-notes
