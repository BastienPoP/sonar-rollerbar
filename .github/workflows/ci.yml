name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  executable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup toolchain install

      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny@0.20.2 cargo-audit@0.22.2

      - name: Check licenses, sources and the dependency allowlist
        run: cargo deny --locked check

      - name: Check for known vulnerabilities
        run: cargo audit

      - name: Check for runtime dependencies outside the windows crates
        run: |
          unexpected=$(cargo tree --locked --target x86_64-pc-windows-gnu -e normal,no-proc-macro \
            --prefix none --format '{p}' | cut -d' ' -f1 | sort -u \
            | grep -Ev '^(sonar-rollerbar|windows(-[a-z]+)?)$' || true)
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi

      - name: Run Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-gnu -- -D warnings

      - name: Run the platform-independent tests
        run: |
          for file in src/config.rs src/gg_protocol.rs src/logfile.rs src/mixer_ui.rs; do
            rustc --edition 2024 --test "$file" -o "$RUNNER_TEMP/tests"
            "$RUNNER_TEMP/tests"
          done

      - name: Build the executable
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Check that WinHTTP is the only network library
        run: |
          imports=$(x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/sonar-rollerbar.exe \
            | grep 'DLL Name')
          echo "$imports"
          if echo "$imports" | grep -Eiq 'ws2_32|wsock32|mswsock|wininet|urlmon|dnsapi|iphlpapi'; then
            exit 1
          fi

      - name: Check that HTTP stays on this computer
        run: |
          test "$(grep -c 'WinHttpConnect(session.0, w!("127.0.0.1"), port, 0)' src/win/loopback.rs)" = 1
          test "$(grep -rc 'WinHttpConnect(' src | awk -F: '{ sum += $2 } END { print sum }')" = 1

      - name: Upload the executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable
          path: target/x86_64-pc-windows-gnu/release/sonar-rollerbar.exe
          if-no-files-found: error

  installer:
    needs: executable
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: executable
          path: target/x86_64-pc-windows-gnu/release

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Compile the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\sonar-rollerbar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: dist/sonar-rollerbar-setup-v*.exe
          if-no-files-found: error
